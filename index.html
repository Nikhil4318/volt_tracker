<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoltTrack • EV Energy & Charging Analytics</title>
  <meta name="description" content="VoltTrack – Track EV charging sessions with charts, session logs and smart cost insights." />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./favicon.svg" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            },
            electric: {
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, PropTypes & Recharts -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Sample Data Script -->
  <script src="./sample_data.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(75, 85, 99, 0.4);
    }
    .recharts-responsive-container {
      min-width: 0;
    }
    /* Skeleton shimmer */
    @keyframes shimmer { 0%{background-position:-800px 0} 100%{background-position:800px 0} }
    .skeleton {
      background: linear-gradient(90deg,#e2e8f0 25%,#f8fafc 50%,#e2e8f0 75%);
      background-size: 800px 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 0.75rem;
    }
    .dark .skeleton {
      background: linear-gradient(90deg,#1e293b 25%,#334155 50%,#1e293b 75%);
      background-size: 800px 100%;
    }
    /* Min touch target for mobile */
    @media (max-width: 768px) {
      button, input, select { min-height: 44px; }
      .touch-sm { min-height: 36px !important; }
    }
    /* Toast */
    #vt-toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999;
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem 1.25rem; border-radius: 1rem;
      font-size: 0.8125rem; font-weight: 600;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      transition: opacity 0.35s, transform 0.35s;
      pointer-events: none;
    }
    #vt-toast.vt-success { background:#10b981; color:#fff; }
    #vt-toast.vt-error   { background:#ef4444; color:#fff; }
    #vt-toast.vt-info    { background:#0ea5e9; color:#fff; }
    #vt-toast.vt-hidden  { opacity:0; transform:translateY(0.75rem); }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const {
      ResponsiveContainer,
      BarChart,
      Bar,
      LineChart,
      Line,
      PieChart,
      Pie,
      Cell,
      XAxis,
      YAxis,
      CartesianGrid,
      Tooltip,
      Legend,
      ReferenceLine
    } = window.Recharts || {};

    // --- TOAST UTILITY ---
    let _toastTimer;
    function showToast(msg, type = 'info') {
      const el = document.getElementById('vt-toast');
      if (!el) return;
      el.textContent = msg;
      el.className = `vt-${type}`;
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => { el.className = 'vt-hidden'; }, 3200);
    }

    // --- ERROR BOUNDARY ---
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, msg: '' }; }
      static getDerivedStateFromError(e) { return { hasError: true, msg: e.message }; }
      componentDidCatch(e, info) { console.error('[VoltTrack]', e, info); }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-center space-y-3">
              <div className="text-3xl">⚡</div>
              <p className="font-bold text-rose-700 dark:text-rose-300">Something went wrong in this section</p>
              <p className="text-xs text-rose-500 font-mono break-all">{this.state.msg}</p>
              <button
                onClick={() => this.setState({ hasError: false, msg: '' })}
                className="mt-2 px-4 py-2 text-xs font-semibold rounded-xl bg-rose-500 hover:bg-rose-600 text-white transition"
              >Retry</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- SKELETON CARD ---
    function SkeletonCard() {
      return (
        <div className="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
          <div className="flex items-start justify-between">
            <div className="space-y-2 flex-1">
              <div className="skeleton h-3 w-24" />
              <div className="skeleton h-7 w-32" />
            </div>
            <div className="skeleton w-11 h-11 rounded-xl" />
          </div>
          <div className="pt-3 border-t border-slate-100 dark:border-slate-800/60 flex justify-between">
            <div className="skeleton h-3 w-28" />
            <div className="skeleton h-3 w-14" />
          </div>
        </div>
      );
    }

    // --- SKELETON CHART ---
    function SkeletonChart({ height = 220 }) {
      return (
        <div className="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
          <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-800/80 pb-3">
            <div className="space-y-1.5">
              <div className="skeleton h-4 w-40" />
              <div className="skeleton h-3 w-28" />
            </div>
            <div className="skeleton h-4 w-16" />
          </div>
          <div className="skeleton w-full" style={{height}} />
        </div>
      );
    }

    // --- EMPTY STATE ---
    function EmptyState({ icon = '🔌', title = 'No data yet', message, action, actionLabel }) {
      return (
        <div className="flex flex-col items-center justify-center py-16 space-y-4 text-center">
          <div className="text-5xl">{icon}</div>
          <div>
            <p className="text-lg font-bold text-slate-700 dark:text-slate-200">{title}</p>
            {message && <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-xs mx-auto">{message}</p>}
          </div>
          {action && (
            <button
              onClick={action}
              className="mt-2 px-5 py-2.5 text-sm font-semibold rounded-xl bg-brand-500 hover:bg-brand-600 text-white transition shadow-sm shadow-brand-500/30"
            >{actionLabel || 'Get Started'}</button>
          )}
        </div>
      );
    }

    // Currency Formatter Utility for Indian Rupee (₹)
    const formatRupee = (val) => {
      const num = Number(val) || 0;
      return `₹${num.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    };

    // --- ICONS ---
    const Icons = {
      Zap: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      ),
      Dashboard: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
      ),
      List: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
        </svg>
      ),
      PlusCircle: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v3m0 0v3m0-3h3m-3-0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      ),
      TrendingUp: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
        </svg>
      ),
      Sun: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      ),
      Moon: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      ),
      Dollar: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V6m0 8c-1.11 0-2.08-.402-2.599-1M12 16v2m9-6a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      ),
      Clock: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      ),
      Gauge: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l2.5 2.5M19.07 4.93a10 10 0 11-14.14 0 10 10 0 0114.14 0zM12 12a2 2 0 100-4 2 2 0 000 4z" />
        </svg>
      ),
      BatteryCharging: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 7L6 13h5l-1 5 6-7h-5l2-4zM4 6h14a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2zM22 10v4" />
        </svg>
      ),
      RefreshCw: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      ),
      Menu: ({ className = "w-6 h-6" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      ),
      Close: ({ className = "w-6 h-6" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      ),
      Search: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      ),
      Trash: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      ),
      Edit: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
      ),
      Download: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
      ),
      Upload: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
      ),
      Calendar: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      ),
      SortAsc: ({ className = "w-3 h-3" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12" />
        </svg>
      ),
      SortDesc: ({ className = "w-3 h-3" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4h13M3 8h9m-9 4h9m5-4v12m0 0l-4-4m4 4l4-4" />
        </svg>
      )
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      // Modal state for Add/Edit session
      const [isFormModalOpen, setIsFormModalOpen] = useState(false);
      const [sessionToEdit, setSessionToEdit] = useState(null);

      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem('ev_tracker_theme');
        return saved || 'dark';
      });

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        localStorage.setItem('ev_tracker_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
      };

      const [isReady, setIsReady] = useState(false);

      const [sessions, setSessions] = useState(() => {
        try {
          const stored = localStorage.getItem('ev_charging_sessions');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.error("Failed to parse stored sessions:", e);
        }
        if (window.SAMPLE_CHARGING_SESSIONS && window.SAMPLE_CHARGING_SESSIONS.length > 0) {
          localStorage.setItem('ev_charging_sessions', JSON.stringify(window.SAMPLE_CHARGING_SESSIONS));
          return window.SAMPLE_CHARGING_SESSIONS;
        }
        return [];
      });

      useEffect(() => { setIsReady(true); }, []);

      // Shared Date Range Filter State for Dashboard
      const [dateFilter, setDateFilter] = useState({
        preset: 'all',
        startDate: '2026-05-18',
        endDate: '2026-11-18'
      });

      useEffect(() => {
        const handleDataLoaded = (e) => {
          if (!sessions || sessions.length === 0) {
            const data = e.detail || window.SAMPLE_CHARGING_SESSIONS;
            if (data && data.length > 0) {
              setSessions(data);
              localStorage.setItem('ev_charging_sessions', JSON.stringify(data));
            }
          }
        };
        window.addEventListener('ev_data_loaded', handleDataLoaded);
        return () => window.removeEventListener('ev_data_loaded', handleDataLoaded);
      }, [sessions]);

      useEffect(() => {
        if (sessions && sessions.length > 0) {
          localStorage.setItem('ev_charging_sessions', JSON.stringify(sessions));
        }
      }, [sessions]);

      const resetToSampleData = () => {
        if (window.SAMPLE_CHARGING_SESSIONS && window.SAMPLE_CHARGING_SESSIONS.length > 0) {
          setSessions(window.SAMPLE_CHARGING_SESSIONS);
          localStorage.setItem('ev_charging_sessions', JSON.stringify(window.SAMPLE_CHARGING_SESSIONS));
          setDateFilter({
            preset: 'all',
            startDate: '2026-05-18',
            endDate: '2026-11-18'
          });
          showToast(`Reset to ${window.SAMPLE_CHARGING_SESSIONS.length} sample sessions`, 'success');
        } else {
          showToast('Sample data not yet loaded. Refresh the page.', 'error');
        }
      };

      // Handle Save Session (Add or Edit)
      const handleSaveSession = (sessionData) => {
        setSessions(prev => {
          const index = prev.findIndex(s => s.id === sessionData.id);
          let updated;
          if (index !== -1) {
            // Edit existing
            updated = [...prev];
            updated[index] = sessionData;
          } else {
            // Add new at top
            updated = [sessionData, ...prev];
          }
          localStorage.setItem('ev_charging_sessions', JSON.stringify(updated));
          return updated;
        });
        setIsFormModalOpen(false);
        setSessionToEdit(null);
      };

      // Handle Edit Trigger
      const handleStartEdit = (session) => {
        setSessionToEdit(session);
        setIsFormModalOpen(true);
      };

      // Handle Delete Session
      const handleDeleteSession = (id) => {
        if (window.confirm && window.confirm(`Delete session ${id}? This cannot be undone.`)) {
          setSessions(prev => {
            const updated = prev.filter(s => s.id !== id);
            localStorage.setItem('ev_charging_sessions', JSON.stringify(updated));
            return updated;
          });
        }
      };

      // Open Add Modal
      const handleOpenAdd = () => {
        setSessionToEdit(null);
        setIsFormModalOpen(true);
      };

      const formatDuration = (mins) => {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        if (h === 0) return `${m}m`;
        return `${h}h ${m}m`;
      };

      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: Icons.Dashboard },
        { id: 'sessions', label: 'Sessions', icon: Icons.List, badge: sessions.length },
        { id: 'add', label: 'Add Session', icon: Icons.PlusCircle },
        { id: 'insights', label: 'Insights', icon: Icons.TrendingUp }
      ];

      if (!isReady) {
        return (
          <div className="flex h-screen items-center justify-center bg-slate-950">
            <div className="text-center space-y-4">
              <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-electric-500 flex items-center justify-center mx-auto shadow-xl shadow-brand-500/40">
                <svg className="w-8 h-8 text-white animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
              </div>
              <p className="text-brand-400 font-semibold text-sm tracking-wide">Loading VoltTrack…</p>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden">
          {/* SIDEBAR */}
          <aside className="hidden md:flex md:w-64 flex-col border-r border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
            <div className="p-6 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-electric-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                  <Icons.Zap className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="font-bold text-lg tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">
                    VoltTrack
                  </h1>

            <div className="p-4 border-t border-slate-200 dark:border-slate-800 space-y-3">

          {/* MAIN CONTAINER */}

            {isMobileMenuOpen && (

                      className={`w-full flex items-center justify-between p-2.5 rounded-lg text-sm font-medium ${

            )}

            <main className="flex-1 overflow-y-auto p-4 pb-24 sm:pb-8 sm:p-8 bg-slate-50/50 dark:bg-slate-950">
              <div className="max-w-7xl mx-auto space-y-8">
                {activeTab === 'dashboard' && (
                  <ErrorBoundary><DashboardView
                    sessions={sessions}
                    formatDuration={formatDuration}

                    dateFilter={dateFilter}

                {activeTab === 'sessions' && (
                  <ErrorBoundary><SessionsView

          {/* BOTTOM TAB BAR (mobile) */}

              }}

      );
    }

    // --- DASHBOARD VIEW COMPONENT (5 Recharts Visualizations) ---
    function DashboardView({ sessions, formatDuration, onNavigate, dateFilter, setDateFilter, theme }) {
      const { minDate, maxDate } = useMemo(() => {
        if (!sessions || sessions.length === 0) return { minDate: '2026-05-18', maxDate: '2026-11-18' };
        let minD = sessions[0].date;
        let maxD = sessions[0].date;
        sessions.forEach(s => {
          if (s.date < minD) minD = s.date;
          if (s.date > maxD) maxD = s.date;
        });
        return { minDate: minD, maxDate: maxD };
      }, [sessions]);

      const handlePresetChange = (presetKey) => {
        if (presetKey === 'all') {
          setDateFilter({ preset: 'all', startDate: minDate, endDate: maxDate });
        } else if (presetKey === '30d') {
          const end = new Date(maxDate + 'T00:00:00');
          const start = new Date(end);
          start.setDate(start.getDate() - 30);
          setDateFilter({ preset: '30d', startDate: start.toISOString().split('T')[0], endDate: maxDate });
        } else if (presetKey === '3m') {
          const end = new Date(maxDate + 'T00:00:00');
          const start = new Date(end);
          start.setMonth(start.getMonth() - 3);
          setDateFilter({ preset: '3m', startDate: start.toISOString().split('T')[0], endDate: maxDate });
        } else if (presetKey === '6m') {
          const end = new Date(maxDate + 'T00:00:00');
          const start = new Date(end);
          start.setMonth(start.getMonth() - 6);
          setDateFilter({ preset: '6m', startDate: start.toISOString().split('T')[0], endDate: maxDate });
        } else if (presetKey === 'custom') {
          setDateFilter(prev => ({ ...prev, preset: 'custom' }));
        }
      };

      const filteredSessions = useMemo(() => {
        if (!sessions || sessions.length === 0) return [];
        return sessions.filter(s => {
          if (!s.date) return false;
          if (dateFilter.startDate && s.date < dateFilter.startDate) return false;
          if (dateFilter.endDate && s.date > dateFilter.endDate) return false;
          return true;
        });
      }, [sessions, dateFilter]);

      const metrics = useMemo(() => {
        if (!filteredSessions || filteredSessions.length === 0) {
          return {
            totalEnergy: 0,
            totalCost: 0,
            count: 0,
            avgCostPerKwh: 0,
            avgDurationMinutes: 0,
            efficiencyKmPerKwh: 0,
            totalDistanceKm: 0,
            chargerBreakdown: { home: 0, public: 0, dcfc: 0 }
          };
        }

        let totalEnergy = 0;
        let totalCost = 0;
        let totalDuration = 0;
        let minOdo = Infinity;
        let maxOdo = -Infinity;
        let homeCount = 0;
        let publicCount = 0;
        let dcfcCount = 0;

        filteredSessions.forEach(s => {
          totalEnergy += (Number(s.energyAddedKwh) || 0);
          totalCost += (Number(s.totalCost) || 0);
          totalDuration += (Number(s.durationMinutes) || 0);
          
          if (s.odometerKm) {
            const odo = Number(s.odometerKm);
            if (odo < minOdo) minOdo = odo;
            if (odo > maxOdo) maxOdo = odo;
          }

          if (s.chargerType === 'Home AC') homeCount++;
          else if (s.chargerType === 'DC Fast') dcfcCount++;
          else publicCount++;
        });

        const count = filteredSessions.length;
        const avgCostPerKwh = totalEnergy > 0 ? (totalCost / totalEnergy) : 0;
        const avgDurationMinutes = count > 0 ? (totalDuration / count) : 0;
        const totalDistanceKm = (maxOdo > minOdo && minOdo !== Infinity) ? (maxOdo - minOdo) : 0;
        const efficiencyKmPerKwh = (totalDistanceKm > 0 && totalEnergy > 0) ? (totalDistanceKm / totalEnergy) : 0;

        return {
          totalEnergy: Math.round(totalEnergy * 10) / 10,
          totalCost: Math.round(totalCost * 100) / 100,
          count,
          avgCostPerKwh: Math.round(avgCostPerKwh * 1000) / 1000,
          avgDurationMinutes: Math.round(avgDurationMinutes),
          totalDistanceKm,
          efficiencyKmPerKwh: Math.round(efficiencyKmPerKwh * 100) / 100,
          chargerBreakdown: { home: homeCount, public: publicCount, dcfc: dcfcCount }
        };
      }, [filteredSessions]);

      // 1. Monthly Energy & Cost Data
      const monthlyData = useMemo(() => {
        if (!filteredSessions || filteredSessions.length === 0) return [];
        const monthMap = {};

        filteredSessions.forEach(s => {
          if (!s.date) return;
          const key = s.date.slice(0, 7);
          if (!monthMap[key]) {
            const [year, month] = key.split('-');
            const dateObj = new Date(Number(year), Number(month) - 1, 1);
            const formattedMonth = dateObj.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
            monthMap[key] = {
              rawKey: key,
              month: formattedMonth,
              totalEnergy: 0,
              sessionCount: 0,
              totalCost: 0
            };
          }
          monthMap[key].totalEnergy += (Number(s.energyAddedKwh) || 0);
          monthMap[key].totalCost += (Number(s.totalCost) || 0);
          monthMap[key].sessionCount += 1;
        });

        return Object.values(monthMap)
          .sort((a, b) => a.rawKey.localeCompare(b.rawKey))
          .map(item => ({
            ...item,
            totalEnergy: Math.round(item.totalEnergy * 10) / 10,
            totalCost: Math.round(item.totalCost * 100) / 100
          }));
      }, [filteredSessions]);

      // 2. Energy by Charger Type (Donut)
      const chargerTypeData = useMemo(() => {
        const types = {
          'Home AC': { name: 'Home AC', energy: 0, count: 0, color: '#10b981' },
          'Public AC': { name: 'Public AC', energy: 0, count: 0, color: '#0ea5e9' },
          'DC Fast': { name: 'DC Fast', energy: 0, count: 0, color: '#f59e0b' }
        };
        filteredSessions.forEach(s => {
          const t = s.chargerType || 'Public AC';
          if (!types[t]) types[t] = { name: t, energy: 0, count: 0, color: '#8b5cf6' };
          types[t].energy += (Number(s.energyAddedKwh) || 0);
          types[t].count += 1;
        });
        const total = Object.values(types).reduce((acc, v) => acc + v.energy, 0);
        return Object.values(types)
          .filter(v => v.energy > 0)
          .map(v => ({
            ...v,
            energy: Math.round(v.energy * 10) / 10,
            percentage: total > 0 ? (v.energy / total) * 100 : 0
          }));
      }, [filteredSessions]);

      // 3. Charging Activity by Hour (24H Bar)
      const hourlyActivity = useMemo(() => {
        const formatHour = (h) => {
          if (h === 0) return '12 AM';
          if (h === 12) return '12 PM';
          return h > 12 ? `${h - 12} PM` : `${h} AM`;
        };

        const hours = Array.from({ length: 24 }, (_, i) => ({
          hour: i,
          hourLabel: formatHour(i),
          hourRange: `${formatHour(i)} - ${formatHour((i + 1) % 24)}`,
          sessions: 0,
          totalEnergy: 0
        }));

        filteredSessions.forEach(s => {
          if (s.startTime) {
            const h = parseInt(s.startTime.split(':')[0], 10);
            if (!isNaN(h) && h >= 0 && h < 24) {
              hours[h].sessions += 1;
              hours[h].totalEnergy += (Number(s.energyAddedKwh) || 0);
            }
          }
        });

        let maxSessions = 0;
        let peakHour = 22;
        hours.forEach(h => {
          h.totalEnergy = Math.round(h.totalEnergy * 10) / 10;
          if (h.sessions > maxSessions) {
            maxSessions = h.sessions;
            peakHour = h.hour;
          }
        });

        return {
          hours: hours.map(h => ({
            ...h,
            isPeak: h.hour === peakHour && h.sessions > 0
          })),
          peakHourLabel: formatHour(peakHour),
          peakSessions: maxSessions
        };
      }, [filteredSessions]);

      // 4. Efficiency Over Time (Consecutive Odometer / kWh)
      const { efficiencyTrendData, overallAverageEfficiency } = useMemo(() => {
        if (!sessions || sessions.length < 2) {
          return { efficiencyTrendData: [], overallAverageEfficiency: 0 };
        }

        const sorted = [...sessions].sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
        const monthlyGroups = {};
        let totalPeriodDeltaKm = 0;
        let totalPeriodEnergy = 0;

        for (let i = 1; i < sorted.length; i++) {
          const prev = sorted[i - 1];
          const curr = sorted[i];

          if (dateFilter.startDate && curr.date < dateFilter.startDate) continue;
          if (dateFilter.endDate && curr.date > dateFilter.endDate) continue;

          const deltaKm = (Number(curr.odometerKm) || 0) - (Number(prev.odometerKm) || 0);
          const energy = Number(curr.energyAddedKwh) || 0;

          if (deltaKm > 0 && energy > 0 && deltaKm < 2000) {
            const monthKey = curr.date.slice(0, 7);
            if (!monthlyGroups[monthKey]) {
              const [year, month] = monthKey.split('-');
              const dateObj = new Date(Number(year), Number(month) - 1, 1);
              monthlyGroups[monthKey] = {
                rawKey: monthKey,
                month: dateObj.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }),
                totalDeltaKm: 0,
                totalEnergy: 0
              };
            }
            monthlyGroups[monthKey].totalDeltaKm += deltaKm;
            monthlyGroups[monthKey].totalEnergy += energy;

            totalPeriodDeltaKm += deltaKm;
            totalPeriodEnergy += energy;
          }
        }

        const overallAvg = totalPeriodEnergy > 0 ? (totalPeriodDeltaKm / totalPeriodEnergy) : 0;

        const trend = Object.values(monthlyGroups)
          .sort((a, b) => a.rawKey.localeCompare(b.rawKey))
          .map(g => {
            const eff = g.totalEnergy > 0 ? (g.totalDeltaKm / g.totalEnergy) : 0;
            return {
              rawKey: g.rawKey,
              month: g.month,
              efficiency: Math.round(eff * 100) / 100,
              totalDeltaKm: Math.round(g.totalDeltaKm),
              totalEnergy: Math.round(g.totalEnergy * 10) / 10
            };
          });

        return {
          efficiencyTrendData: trend,
          overallAverageEfficiency: Math.round(overallAvg * 100) / 100
        };
      }, [sessions, dateFilter]);

      // Tooltip Components
      const EnergyBarTooltip = ({ active, payload }) => {
        if (active && payload && payload.length) {
          const item = payload[0].payload;
          return (
            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-xl shadow-xl text-xs space-y-1 min-w-[160px]">
              <div className="font-bold text-slate-900 dark:text-white pb-1 border-b border-slate-100 dark:border-slate-800 flex justify-between">
                <span>{item.month}</span>
                <span className="font-mono text-emerald-500 font-semibold">{item.sessionCount} sessions</span>
              </div>
              <div className="flex justify-between pt-1 text-slate-600 dark:text-slate-300">
                <span>Total Energy:</span>
                <span className="font-bold font-mono text-emerald-500">{item.totalEnergy.toFixed(1)} kWh</span>
              </div>
            </div>
          );
        }
        return null;
      };

      const CostLineTooltip = ({ active, payload }) => {
        if (active && payload && payload.length) {
          const item = payload[0].payload;
          return (
            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-xl shadow-xl text-xs space-y-1 min-w-[160px]">
              <div className="font-bold text-slate-900 dark:text-white pb-1 border-b border-slate-100 dark:border-slate-800 flex justify-between">
                <span>{item.month}</span>
                <span className="text-sky-500 font-mono font-semibold">Cost</span>
              </div>
              <div className="flex justify-between pt-1 text-slate-600 dark:text-slate-300">
                <span>Total Cost:</span>
                <span className="font-bold font-mono text-sky-500">{formatRupee(item.totalCost)}</span>
              </div>
            </div>
          );
        }
        return null;
      };

      const DonutTooltip = ({ active, payload }) => {
        if (active && payload && payload.length) {
          const item = payload[0].payload;
          return (
            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-xl shadow-xl text-xs space-y-1 min-w-[160px]">
              <div className="font-bold text-slate-900 dark:text-white pb-1 border-b border-slate-100 dark:border-slate-800 flex justify-between">
                <span>{item.name}</span>
                <span className="font-mono text-slate-400">{item.count} charges</span>
              </div>
              <div className="flex justify-between pt-1 text-slate-600 dark:text-slate-300">
                <span>Total Energy:</span>
                <span className="font-bold font-mono text-emerald-500">{item.energy.toFixed(1)} kWh</span>
              </div>
              <div className="flex justify-between text-slate-500 dark:text-slate-400">
                <span>Share:</span>
                <span className="font-bold font-mono text-slate-800 dark:text-slate-200">{item.percentage.toFixed(1)}%</span>
              </div>
            </div>
          );
        }
        return null;
      };

      const HourlyTooltip = ({ active, payload }) => {
        if (active && payload && payload.length) {
          const item = payload[0].payload;
          return (
            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-xl shadow-xl text-xs space-y-1 min-w-[170px]">
              <div className="font-bold text-slate-900 dark:text-white pb-1 border-b border-slate-100 dark:border-slate-800 flex justify-between">
                <span>{item.hourRange}</span>
                {item.isPeak && <span className="text-[10px] bg-purple-500 text-white px-1.5 py-0.5 rounded font-bold">PEAK</span>}
              </div>
              <div className="flex justify-between pt-1 text-slate-600 dark:text-slate-300">
                <span>Sessions:</span>
                <span className="font-bold font-mono text-slate-900 dark:text-white">{item.sessions}</span>
              </div>
              <div className="flex justify-between text-slate-500 dark:text-slate-400">
                <span>Energy:</span>
                <span className="font-bold font-mono text-emerald-500">{item.totalEnergy.toFixed(1)} kWh</span>
              </div>
            </div>
          );
        }
        return null;
      };

      const EfficiencyTooltip = ({ active, payload }) => {
        if (active && payload && payload.length) {
          const item = payload[0].payload;
          return (
            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-xl shadow-xl text-xs space-y-1 min-w-[180px]">
              <div className="font-bold text-slate-900 dark:text-white pb-1 border-b border-slate-100 dark:border-slate-800 flex justify-between">
                <span>{item.month}</span>
                <span className="text-purple-500 font-mono font-semibold">{item.efficiency.toFixed(2)} km/kWh</span>
              </div>
              <div className="flex justify-between pt-1 text-slate-500 dark:text-slate-400">
                <span>Distance Logged:</span>
                <span className="font-mono text-slate-800 dark:text-slate-200">{item.totalDeltaKm.toLocaleString()} km</span>
              </div>
