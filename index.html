    // --- SESSIONS TABLE VIEW (Sortable, Searchable, Filters, Edit/Delete, CSV Import/Export) ---
    function SessionsView({ sessions, formatDuration, onDelete, onEdit, onOpenAdd, onUpdateSessions }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [typeFilter, setTypeFilter] = useState('ALL');
      const [startDateFilter, setStartDateFilter] = useState('');
      const [endDateFilter, setEndDateFilter] = useState('');

      // Sorting state
      const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });

      // Pagination state
      const [currentPage, setCurrentPage] = useState(1);
      const pageSize = 15;

      const fileInputRef = useRef(null);

      // Handle sort column click
      const handleSort = (key) => {
        setSortConfig(prev => {
          if (prev.key === key) {
            return { key, direction: prev.direction === 'asc' ? 'desc' : 'asc' };
          }
          return { key, direction: 'desc' };
        });
      };

      // Filtered and Sorted Sessions
      const processedSessions = useMemo(() => {
        let result = sessions.filter(s => {
          // Type filter
          if (typeFilter !== 'ALL' && s.chargerType !== typeFilter) return false;
          // Date range
          if (startDateFilter && s.date < startDateFilter) return false;
          if (endDateFilter && s.date > endDateFilter) return false;
          // Search query
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchLoc = (s.locationName || '').toLowerCase().includes(q);
            const matchId = (s.id || '').toLowerCase().includes(q);
            const matchDate = (s.date || '').includes(q);
            const matchType = (s.chargerType || '').toLowerCase().includes(q);
            if (!matchLoc && !matchId && !matchDate && !matchType) return false;
          }
          return true;
        });

        // Sorting
        result.sort((a, b) => {
          let valA = a[sortConfig.key];
          let valB = b[sortConfig.key];

          // Handle numerical vs string
          if (['energyAddedKwh', 'totalCost', 'durationMinutes', 'odometerKm', 'costPerKwh'].includes(sortConfig.key)) {
            valA = Number(valA) || 0;
            valB = Number(valB) || 0;
          } else if (sortConfig.key === 'date') {
            valA = (a.date || '') + (a.startTime || '');
            valB = (b.date || '') + (b.startTime || '');
          } else {
            valA = (valA || '').toString().toLowerCase();
            valB = (valB || '').toString().toLowerCase();
          }

          if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
          if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
          return 0;
        });

        return result;
      }, [sessions, typeFilter, startDateFilter, endDateFilter, searchQuery, sortConfig]);

      // Paginated slice
      const totalPages = Math.ceil(processedSessions.length / pageSize) || 1;
      const paginatedSessions = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return processedSessions.slice(start, start + pageSize);
      }, [processedSessions, currentPage, pageSize]);

      // Reset to page 1 on filter/search change
      useEffect(() => {
        setCurrentPage(1);
      }, [searchQuery, typeFilter, startDateFilter, endDateFilter]);

      // --- CSV EXPORT ---
      const handleExportCSV = () => {
        if (!sessions || sessions.length === 0) {
          showToast('No sessions to export.', 'info'); return;
          return;
        }
        const headers = [
          'id', 'date', 'startTime', 'durationMinutes', 'energyAddedKwh',
          'startSoC', 'endSoC', 'chargerType', 'locationName',
          'costPerKwh', 'totalCost', 'odometerKm'
        ];
        const rows = sessions.map(s => [
          s.id,
          s.date,
          s.startTime || '00:00',
          s.durationMinutes || 0,
          s.energyAddedKwh || 0,
          s.startSoC || 0,
          s.endSoC || 0,
          `"${(s.chargerType || '').replace(/"/g, '""')}"`,
          `"${(s.locationName || '').replace(/"/g, '""')}"`,
          s.costPerKwh || 0,
          s.totalCost || 0,
          s.odometerKm || ''
        ].join(','));

        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `ev_charging_sessions_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // --- CSV IMPORT ---
      const handleImportCSV = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const text = event.target.result;
            const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length < 2) {
              showToast('Invalid CSV: missing headers or data rows.', 'error'); return;
              return;
            }

            const headerLine = lines[0];
            const headers = headerLine.split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const imported = [];

            for (let i = 1; i < lines.length; i++) {
              // Regex to parse comma separated values while respecting quotes
              const row = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
              if (row.length >= 8) {
                const s = {};
                headers.forEach((h, idx) => {
                  let val = row[idx] ? row[idx].trim().replace(/^"|"$/g, '') : '';
                  s[h] = val;
                });

                if (s.date && (s.energyAddedKwh || s.energyKwh)) {
                  const energy = Number(s.energyAddedKwh || s.energyKwh) || 0;
                  const rate = Number(s.costPerKwh) || 12;
                  const cost = Number(s.totalCost || s.cost) || Math.round(energy * rate * 100) / 100;

                  imported.push({
                    id: s.id || `EV-CHG-${Date.now()}-${i}`,
                    date: s.date,
                    startTime: s.startTime || '12:00',
                    durationMinutes: Number(s.durationMinutes) || 60,
                    energyAddedKwh: energy,
                    startSoC: Number(s.startSoC) || 20,
                    endSoC: Number(s.endSoC) || 80,
                    chargerType: s.chargerType || 'Home AC',
                    locationName: s.locationName || 'Imported Station',
                    costPerKwh: rate,
                    totalCost: cost,
                    odometerKm: s.odometerKm ? Number(s.odometerKm) : undefined
                  });
                }
              }
            }

            if (imported.length > 0) {
              onUpdateSessions(prev => {
                const existingIds = new Set(prev.map(p => p.id));
                const newItems = imported.filter(item => !existingIds.has(item.id));
                const combined = [...newItems, ...prev];
                localStorage.setItem('ev_charging_sessions', JSON.stringify(combined));
                return combined;
              });
              showToast(`Imported ${imported.length} new sessions!`, 'success');
            } else {
              showToast('No valid sessions found in this CSV file.', 'error');
            }
          } catch (err) {
            console.error('Import error:', err);
            showToast('CSV parse failed: ' + err.message, 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      // Header helper with sort arrow
      const renderSortableHeader = (label, fieldKey, alignRight = false) => {
        const isSorted = sortConfig.key === fieldKey;
        return (
          <th
            onClick={() => handleSort(fieldKey)}
            className={`py-3.5 px-4 cursor-pointer select-none hover:text-brand-500 transition ${alignRight ? 'text-right' : ''}`}
          >
            <div className={`inline-flex items-center gap-1.5 ${alignRight ? 'justify-end' : ''}`}>
              <span>{label}</span>
              <span className={`text-[10px] ${isSorted ? 'text-brand-500' : 'text-slate-400'}`}>
                {isSorted ? (sortConfig.direction === 'asc' ? '▲' : '▼') : '↕'}
              </span>
            </div>
          </th>
        );
      };

      return (
        <div className="space-y-6">
          {/* Header & Action Toolbar */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-extrabold text-slate-900 dark:text-white">All Charging Logs</h2>
              <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                Displaying {processedSessions.length} of {sessions.length} total recorded charging events.
              </p>
            </div>

            {/* Actions: Export, Import, Log */}
            <div className="flex flex-wrap items-center gap-2">
              <input
                type="file"
                ref={fileInputRef}
                onChange={handleImportCSV}
                accept=".csv"
                className="hidden"
              />
              <button
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                title="Import sessions from a CSV file"
                className="flex items-center space-x-1.5 px-3 py-2 text-xs font-semibold rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition shadow-sm"
              >
                <Icons.Upload className="w-3.5 h-3.5 text-brand-500" />
                <span>Import CSV</span>
              </button>

              <button
                onClick={handleExportCSV}
                title="Export all sessions to a CSV file"
                className="flex items-center space-x-1.5 px-3 py-2 text-xs font-semibold rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition shadow-sm"
              >
                <Icons.Download className="w-3.5 h-3.5 text-brand-500" />
                <span>Export CSV</span>
              </button>

              <button
                onClick={onOpenAdd}
                className="flex items-center space-x-1.5 bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold shadow-sm shadow-brand-500/30 transition"
              >
                <Icons.PlusCircle className="w-4 h-4" />
                <span>Log New Session</span>
              </button>
            </div>
          </div>

          {/* Search & Filter Controls */}
          <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-3">
            <div className="flex flex-col md:flex-row items-center justify-between gap-3">
              {/* Search Box */}
              <div className="relative w-full md:w-80">
                <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                  <Icons.Search className="w-4 h-4" />
                </span>
                <input
                  type="text"
                  placeholder="Search station, ID, or date..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="w-full pl-9 pr-3 py-2 text-xs sm:text-sm rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
              </div>

              {/* Charger Type Filter */}
              <div className="flex items-center space-x-1.5 w-full md:w-auto overflow-x-auto">
                {['ALL', 'Home AC', 'DC Fast', 'Public AC'].map(type => (
                  <button
                    key={type}
                    onClick={() => setTypeFilter(type)}
                    className={`px-3 py-1.5 text-xs font-semibold rounded-xl transition ${
                      typeFilter === type
                        ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-sm'
                        : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'
                    }`}
                  >
                    {type}
                  </button>
                ))}
              </div>
            </div>

            {/* Date Range Pickers */}
            <div className="pt-2 border-t border-slate-100 dark:border-slate-800/80 flex flex-wrap items-center gap-3 text-xs">
              <span className="font-semibold text-slate-500 dark:text-slate-400">Filter Dates:</span>
              <div className="flex items-center space-x-1.5">
                <span className="text-slate-400">From:</span>
                <input
                  type="date"
                  value={startDateFilter}
                  onChange={e => setStartDateFilter(e.target.value)}
                  className="px-2.5 py-1 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-xs"
                />
              </div>
              <div className="flex items-center space-x-1.5">
                <span className="text-slate-400">To:</span>
                <input
                  type="date"
                  value={endDateFilter}
                  min={startDateFilter}
                  onChange={e => setEndDateFilter(e.target.value)}
                  className="px-2.5 py-1 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-xs"
                />
              </div>
              {(startDateFilter || endDateFilter || searchQuery || typeFilter !== 'ALL') && (
                <button
                  onClick={() => {
                    setStartDateFilter('');
                    setEndDateFilter('');
                    setSearchQuery('');
                    setTypeFilter('ALL');
                  }}
                  className="text-xs text-brand-600 dark:text-brand-400 font-semibold hover:underline ml-auto"
                >
                  Clear All Filters
                </button>
              )}
            </div>
          </div>

          {/* Table Container */}
          <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs sm:text-sm">
                <thead className="sticky top-0 bg-slate-50 dark:bg-slate-800/90 backdrop-blur-md z-10 border-b border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 font-semibold uppercase tracking-wider text-[11px]">
                  <tr>
                    {renderSortableHeader('Session ID', 'id')}
                    {renderSortableHeader('Date & Time', 'date')}
                    {renderSortableHeader('Type', 'chargerType')}
                    {renderSortableHeader('Location', 'locationName')}
                    <th className="py-3.5 px-4 text-center">SoC Δ</th>
                    {renderSortableHeader('Energy', 'energyAddedKwh', true)}
                    {renderSortableHeader('Cost', 'totalCost', true)}
                    {renderSortableHeader('Rate', 'costPerKwh', true)}
                    {renderSortableHeader('Duration', 'durationMinutes', true)}
                    {renderSortableHeader('Odometer', 'odometerKm', true)}
                    <th className="py-3.5 px-4 text-center">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800/60 font-medium text-slate-700 dark:text-slate-300">
                  {paginatedSessions.length === 0 ? (
                    <tr>
                      <td colSpan="11" className="py-12 text-center text-slate-400">
                        <span className="block text-2xl mb-2">🔍</span>No sessions matched your search or filters. Try clearing some filters.
                      </td>
                    </tr>
                  ) : (
                    paginatedSessions.map(session => (
                      <tr key={session.id} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
                        <td className="py-3 px-4 font-mono text-xs font-semibold text-slate-500 dark:text-slate-400">
                          {session.id}
                        </td>
                        <td className="py-3 px-4 whitespace-nowrap">
                          {session.date} <span className="text-slate-400 text-xs">({session.startTime || '—'})</span>
                        </td>
                        <td className="py-3 px-4 whitespace-nowrap">
                          <span className={`inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold ${
                            session.chargerType === 'Home AC'
                              ? 'bg-emerald-100 dark:bg-emerald-950/70 text-emerald-700 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800'
                              : session.chargerType === 'DC Fast'
                              ? 'bg-amber-100 dark:bg-amber-950/70 text-amber-700 dark:text-amber-300 border border-amber-300 dark:border-amber-800'
                              : 'bg-sky-100 dark:bg-sky-950/70 text-sky-700 dark:text-sky-300 border border-sky-300 dark:border-sky-800'
                          }`}>
                            {session.chargerType}
                          </span>
                        </td>
                        <td className="py-3 px-4 truncate max-w-xs" title={session.locationName}>
                          {session.locationName}
                        </td>
                        <td className="py-3 px-4 text-center whitespace-nowrap">
                          <span className="text-xs font-mono bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded">
                            {session.startSoC}% → {session.endSoC}%
                          </span>
                        </td>
                        <td className="py-3 px-4 text-right font-mono font-semibold text-slate-900 dark:text-white whitespace-nowrap">
                          {session.energyAddedKwh} kWh
                        </td>
                        <td className="py-3 px-4 text-right font-mono text-emerald-600 dark:text-emerald-400 whitespace-nowrap font-semibold">
                          {formatRupee(session.totalCost)}
                        </td>
                        <td className="py-3 px-4 text-right font-mono text-slate-500 dark:text-slate-400 whitespace-nowrap">
                          {formatRupee(session.costPerKwh)}/kWh
                        </td>
                        <td className="py-3 px-4 text-right font-mono text-slate-500 dark:text-slate-400 whitespace-nowrap">
                          {formatDuration(session.durationMinutes)}
                        </td>
                        <td className="py-3 px-4 text-right font-mono text-slate-500 dark:text-slate-400 whitespace-nowrap">
                          {session.odometerKm ? `${session.odometerKm.toLocaleString()} km` : '—'}
                        </td>
                        <td className="py-3 px-4 text-center whitespace-nowrap">
                          <div className="flex items-center justify-center space-x-1.5">
                            <button
                              onClick={() => onEdit(session)}
                              title="Edit session"
                              className="p-1.5 rounded-lg text-slate-400 hover:text-brand-500 hover:bg-brand-50 dark:hover:bg-brand-950/40 transition"
                            >
                              <Icons.Edit className="w-4 h-4" />
                            </button>
                            <button
                              onClick={() => onDelete(session.id)}
                              title="Delete session"
                              className="p-1.5 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 transition"
                            >
                              <Icons.Trash className="w-4 h-4" />
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>

            {/* Pagination Controls */}
            {totalPages > 1 && (
              <div className="p-4 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                <span>
                  Showing {((currentPage - 1) * pageSize) + 1} to {Math.min(currentPage * pageSize, processedSessions.length)} of {processedSessions.length} sessions
                </span>
                <div className="flex items-center space-x-1.5">
                  <button
                    disabled={currentPage === 1}
                    onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))}
                    className="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                  >
                    Previous
                  </button>
                  <span className="font-semibold px-2">Page {currentPage} of {totalPages}</span>
                  <button
                    disabled={currentPage === totalPages}
                    onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))}
                    className="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                  >
                    Next
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- ADD / EDIT SESSION MODAL WITH COMPREHENSIVE VALIDATION ---
    function AddEditSessionModal({ session, onSave, onClose }) {
      const isEdit = Boolean(session && session.id);

      const [formData, setFormData] = useState({
        id: session?.id || `EV-CHG-${Date.now().toString().slice(-4)}`,
        date: session?.date || new Date().toISOString().split('T')[0],
        startTime: session?.startTime || '22:00',
        chargerType: session?.chargerType || 'Home AC',
        locationName: session?.locationName || 'Home - Garage Wallbox (7.4 kW)',
        startSoC: session?.startSoC !== undefined ? session.startSoC : 30,
        endSoC: session?.endSoC !== undefined ? session.endSoC : 80,
        energyAddedKwh: session?.energyAddedKwh !== undefined ? session.energyAddedKwh : 40.5,
        costPerKwh: session?.costPerKwh !== undefined ? session.costPerKwh : 12.0,
        totalCost: session?.totalCost !== undefined ? session.totalCost : 486.0,
        durationMinutes: session?.durationMinutes !== undefined ? session.durationMinutes : 320,
        odometerKm: session?.odometerKm !== undefined ? session.odometerKm : 42350
      });

      const [errors, setErrors] = useState({});

      // Auto-calculate energy based on SoC change
      const handleSoCChange = (startVal, endVal) => {
        const s = Number(startVal);
        const e = Number(endVal);
        const newForm = { ...formData, startSoC: s, endSoC: e };

        if (!isNaN(s) && !isNaN(e) && e > s) {
          // Estimated ~75 kWh battery with 8% thermal/charging overhead
          const estKwh = Math.round(((e - s) / 100 * 75 * 1.08) * 10) / 10;
          const cost = Math.round(estKwh * formData.costPerKwh * 100) / 100;
          newForm.energyAddedKwh = estKwh;
          newForm.totalCost = cost;
        }
        setFormData(newForm);
      };

      // Auto-calculate cost when Energy or Rate changes
      const handleEnergyChange = (val) => {
        const kwh = Number(val);
        const cost = Math.round(kwh * formData.costPerKwh * 100) / 100;
        setFormData(prev => ({ ...prev, energyAddedKwh: val, totalCost: isNaN(cost) ? 0 : cost }));
      };

      const handleRateChange = (val) => {
        const rate = Number(val);
        const cost = Math.round(formData.energyAddedKwh * rate * 100) / 100;
        setFormData(prev => ({ ...prev, costPerKwh: val, totalCost: isNaN(cost) ? 0 : cost }));
      };

      const handleTypeChange = (type) => {
        let defaultLoc = formData.locationName;
        let rate = formData.costPerKwh;
        let duration = formData.durationMinutes;

        if (type === 'Home AC') {
          defaultLoc = 'Home - Garage Wallbox (7.4 kW)';
          rate = 12.0;
          duration = 320;
        } else if (type === 'DC Fast') {
          defaultLoc = 'Tesla Supercharger - Highway 101';
          rate = 38.5;
          duration = 35;
        } else if (type === 'Public AC') {
          defaultLoc = 'Municipal Commuter Parking (L2)';
          rate = 18.0;
          duration = 120;
        }

        const cost = Math.round(formData.energyAddedKwh * rate * 100) / 100;
        setFormData(prev => ({
          ...prev,
          chargerType: type,
          locationName: defaultLoc,
          costPerKwh: rate,
          durationMinutes: duration,
          totalCost: cost
        }));
      };

      // Validation logic
      const validate = () => {
        const errs = {};
        if (!formData.date) errs.date = 'Date is required.';
        if (!formData.locationName || !formData.locationName.trim()) {
          errs.locationName = 'Location name is required.';
        }
        if (formData.startSoC < 0 || formData.startSoC > 100) {
          errs.startSoC = 'Start SoC must be between 0% and 100%.';
        }
        if (formData.endSoC < 0 || formData.endSoC > 100) {
          errs.endSoC = 'End SoC must be between 0% and 100%.';
        }
        if (Number(formData.endSoC) <= Number(formData.startSoC)) {
          errs.endSoC = 'End battery SoC must be strictly greater than Start SoC.';
        }
        if (!formData.energyAddedKwh || Number(formData.energyAddedKwh) <= 0) {
          errs.energyAddedKwh = 'Energy added must be greater than 0 kWh.';
        }
        if (formData.costPerKwh === '' || Number(formData.costPerKwh) < 0) {
          errs.costPerKwh = 'Cost per kWh cannot be negative.';
        }
        if (!formData.durationMinutes || Number(formData.durationMinutes) <= 0) {
          errs.durationMinutes = 'Duration must be greater than 0 minutes.';
        }
        return errs;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const errs = validate();
        if (Object.keys(errs).length > 0) {
          setErrors(errs);
          return;
        }

        const cleanedSession = {
          id: formData.id,
          date: formData.date,
          startTime: formData.startTime || '22:00',
          durationMinutes: Number(formData.durationMinutes),
          energyAddedKwh: Number(formData.energyAddedKwh),
          startSoC: Number(formData.startSoC),
          endSoC: Number(formData.endSoC),
          chargerType: formData.chargerType,
          locationName: formData.locationName.trim(),
          costPerKwh: Number(formData.costPerKwh),
          totalCost: Number(formData.totalCost),
          odometerKm: formData.odometerKm ? Number(formData.odometerKm) : undefined
        };

        onSave(cleanedSession);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm overflow-y-auto">
          <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-2xl p-6 sm:p-8 space-y-6 animate-in fade-in zoom-in-95 duration-150">
            {/* Modal Header */}
            <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4">
              <div>
                <h3 className="text-xl font-bold text-slate-900 dark:text-white">
                  {isEdit ? 'Edit Charging Session' : 'Log New Charging Session'}
                </h3>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                  {isEdit ? `Updating recorded log: ${formData.id}` : 'Record a new charging event into local storage'}
                </p>
              </div>
              <button
                onClick={onClose}
                className="p-1.5 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
              >
                <Icons.Close className="w-5 h-5" />
              </button>
            </div>

            {/* Modal Form */}
            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {/* Date */}
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Date <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="date"
                    required
                    value={formData.date}
                    onChange={e => {
                      setFormData({ ...formData, date: e.target.value });
                      if (errors.date) setErrors({ ...errors, date: null });
                    }}
                    className={`w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-sm focus:ring-2 focus:ring-brand-500 ${
                      errors.date ? 'border-rose-500 dark:border-rose-500' : 'border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white'
                    }`}
                  />
                  {errors.date && <p className="text-[11px] text-rose-500 mt-1">{errors.date}</p>}
                </div>

                {/* Start Time */}
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Start Time
                  </label>
                  <input
                    type="time"
                    value={formData.startTime}
                    onChange={e => setFormData({ ...formData, startTime: e.target.value })}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-brand-500"
                  />
                </div>

                {/* Charger Type */}
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Charger Type
                  </label>
                  <select
                    value={formData.chargerType}
                    onChange={e => handleTypeChange(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-brand-500"
                  >
                    <option value="Home AC">Home AC (Level 2)</option>
                    <option value="DC Fast">DC Fast / Supercharger</option>
                    <option value="Public AC">Public AC (Level 2)</option>
                  </select>
                </div>

                {/* Location Name */}
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Location / Station Name <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. Home Garage, Tesla Supercharger"
                    value={formData.locationName}
                    onChange={e => {
                      setFormData({ ...formData, locationName: e.target.value });
                      if (errors.locationName) setErrors({ ...errors, locationName: null });
                    }}
                    className={`w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-sm focus:ring-2 focus:ring-brand-500 ${
                      errors.locationName ? 'border-rose-500 dark:border-rose-500' : 'border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white'
                    }`}
                  />
                  {errors.locationName && <p className="text-[11px] text-rose-500 mt-1">{errors.locationName}</p>}
                </div>

                {/* Start SoC (%) */}
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Start Battery SoC (%) <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="number"
                    min="0"
                    max="100"
                    required
                    value={formData.startSoC}
                    onChange={e => handleSoCChange(e.target.value, formData.endSoC)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-brand-500"
                  />
                  {errors.startSoC && <p className="text-[11px] text-rose-500 mt-1">{errors.startSoC}</p>}
                </div>

                {/* End SoC (%) */}
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    End Battery SoC (%) <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="number"
                    min="0"
                    max="100"
                    required
                    value={formData.endSoC}
                    onChange={e => handleSoCChange(formData.startSoC, e.target.value)}
                    className={`w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-sm focus:ring-2 focus:ring-brand-500 ${
                      errors.endSoC ? 'border-rose-500 dark:border-rose-500' : 'border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white'
                    }`}
                  />
                  {errors.endSoC && <p className="text-[11px] text-rose-500 mt-1">{errors.endSoC}</p>}
                </div>

                {/* Energy Added (kWh) */}
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Energy Added (kWh) <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="number"
                    step="0.1"
                    min="0.1"
                    required
                    value={formData.energyAddedKwh}
                    onChange={e => handleEnergyChange(e.target.value)}
                    className={`w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-sm focus:ring-2 focus:ring-brand-500 ${
                      errors.energyAddedKwh ? 'border-rose-500 dark:border-rose-500' : 'border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-mono'
                    }`}
                  />
                  {errors.energyAddedKwh && <p className="text-[11px] text-rose-500 mt-1">{errors.energyAddedKwh}</p>}
                </div>

                {/* Rate per kWh (₹) */}
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Rate per kWh (₹) <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="number"
                    step="0.01"
                    min="0"
                    required
                    value={formData.costPerKwh}
                    onChange={e => handleRateChange(e.target.value)}
                    className={`w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-sm focus:ring-2 focus:ring-brand-500 ${
                      errors.costPerKwh ? 'border-rose-500 dark:border-rose-500' : 'border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-mono'
                    }`}
                  />
                  {errors.costPerKwh && <p className="text-[11px] text-rose-500 mt-1">{errors.costPerKwh}</p>}
                </div>

                {/* Total Cost (Auto-calculated) */}
                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300">
                      Total Cost (₹)
                    </label>
                    <span className="text-[10px] text-brand-600 dark:text-brand-400 font-medium">Auto-calculated</span>
                  </div>
                  <input
                    type="number"
                    step="0.01"
                    value={formData.totalCost}
                    onChange={e => setFormData({ ...formData, totalCost: e.target.value })}
                    className="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm font-mono font-semibold focus:ring-2 focus:ring-brand-500"
                  />
                </div>

                {/* Duration (minutes) */}
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Duration (minutes) <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="number"
                    min="1"
                    required
                    value={formData.durationMinutes}
                    onChange={e => {
                      setFormData({ ...formData, durationMinutes: e.target.value });
                      if (errors.durationMinutes) setErrors({ ...errors, durationMinutes: null });
                    }}
                    className={`w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-sm focus:ring-2 focus:ring-brand-500 ${
                      errors.durationMinutes ? 'border-rose-500 dark:border-rose-500' : 'border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-mono'
                    }`}
                  />
                  {errors.durationMinutes && <p className="text-[11px] text-rose-500 mt-1">{errors.durationMinutes}</p>}
                </div>

                {/* Odometer (km) */}
                <div className="sm:col-span-2">
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Vehicle Odometer (km)
                  </label>
                  <input
                    type="number"
                    placeholder="e.g. 42350"
                    value={formData.odometerKm || ''}
                    onChange={e => setFormData({ ...formData, odometerKm: e.target.value })}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm font-mono focus:ring-2 focus:ring-brand-500"
                  />
                </div>
              </div>

              {/* Form Buttons */}
              <div className="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 text-xs sm:text-sm font-semibold rounded-xl bg-brand-500 hover:bg-brand-600 text-white shadow-sm shadow-brand-500/30 transition"
                >
                  {isEdit ? 'Update Session' : 'Save Session'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- INSIGHTS VIEW COMPONENT (Plain Language Intelligence & Projections) ---
    function InsightsView({ sessions }) {
      // 1. Most Expensive Charging Location
      const mostExpensiveLocation = useMemo(() => {
        if (!sessions || sessions.length === 0) return null;
        const map = {};
        sessions.forEach(s => {
          const loc = s.locationName || 'Unknown Location';
          if (!map[loc]) map[loc] = { name: loc, energy: 0, cost: 0, count: 0, type: s.chargerType };
          map[loc].energy += (Number(s.energyAddedKwh) || 0);
          map[loc].cost += (Number(s.totalCost) || 0);
          map[loc].count += 1;
        });
        const list = Object.values(map).map(l => ({
          ...l,
          avgRate: l.energy > 0 ? (l.cost / l.energy) : 0
        }));
        list.sort((a, b) => b.avgRate - a.avgRate);
        return list[0] || null;
      }, [sessions]);

      // 2. Cheapest vs. Most Expensive Charger Type per kWh
      const chargerRateComparison = useMemo(() => {
        if (!sessions || sessions.length === 0) return null;
        const types = {};
        sessions.forEach(s => {
          const t = s.chargerType || 'Public AC';
          if (!types[t]) types[t] = { name: t, energy: 0, cost: 0, count: 0 };
          types[t].energy += (Number(s.energyAddedKwh) || 0);
          types[t].cost += (Number(s.totalCost) || 0);
          types[t].count += 1;
        });
        const list = Object.values(types).map(t => ({
          ...t,
          avgRate: t.energy > 0 ? (t.cost / t.energy) : 0
        })).filter(t => t.energy > 0);

        list.sort((a, b) => a.avgRate - b.avgRate);
        if (list.length === 0) return null;

        const cheapest = list[0];
        const mostExpensive = list[list.length - 1];
        const multiplier = cheapest.avgRate > 0 ? (mostExpensive.avgRate / cheapest.avgRate).toFixed(1) : '1.0';

        return { list, cheapest, mostExpensive, multiplier };
      }, [sessions]);

      // 3. Peak Charging Hours
      const peakHours = useMemo(() => {
        if (!sessions || sessions.length === 0) return null;
        const hours = Array.from({ length: 24 }, (_, i) => ({ hour: i, count: 0, energy: 0 }));
        sessions.forEach(s => {
          if (s.startTime) {
            const h = parseInt(s.startTime.split(':')[0], 10);
            if (!isNaN(h) && h >= 0 && h < 24) {
              hours[h].count += 1;
              hours[h].energy += (Number(s.energyAddedKwh) || 0);
            }
          }
        });
        hours.sort((a, b) => b.count - a.count);
        const top = hours[0];
        const formatH = (h) => (h === 0 ? '12 AM' : h === 12 ? '12 PM' : h > 12 ? `${h - 12} PM` : `${h} AM`);
        const windowStr = `${formatH(top.hour)} – ${formatH((top.hour + 1) % 24)}`;
        const percentage = sessions.length > 0 ? Math.round((top.count / sessions.length) * 100) : 0;
        return { topHour: formatH(top.hour), windowStr, count: top.count, percentage, energy: top.energy };
      }, [sessions]);

      // 4. Month-over-Month (MoM) Change in Energy Use
      const momChange = useMemo(() => {
        if (!sessions || sessions.length === 0) return null;
        const monthMap = {};
        sessions.forEach(s => {
          if (!s.date) return;
          const key = s.date.slice(0, 7);
          if (!monthMap[key]) {
            const [year, month] = key.split('-');
            const d = new Date(Number(year), Number(month) - 1, 1);
            monthMap[key] = {
              key,
              label: d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }),
              energy: 0,
              cost: 0
            };
          }
          monthMap[key].energy += (Number(s.energyAddedKwh) || 0);
          monthMap[key].cost += (Number(s.totalCost) || 0);
        });
        const sorted = Object.values(monthMap).sort((a, b) => a.key.localeCompare(b.key));
        if (sorted.length < 2) return null;

        const curr = sorted[sorted.length - 1];
        const prev = sorted[sorted.length - 2];
        const diffKwh = curr.energy - prev.energy;
        const pct = prev.energy > 0 ? (diffKwh / prev.energy) * 100 : 0;

        return {
          curr,
          prev,
          diffKwh: Math.round(diffKwh * 10) / 10,
          pctChange: Math.round(pct * 10) / 10
        };
      }, [sessions]);

      // 5. Estimated Savings if All Charging was Done at Home
      const allHomeSavings = useMemo(() => {
        if (!sessions || sessions.length === 0) return null;
        let homeEnergy = 0;
        let homeCost = 0;
        let nonHomeEnergy = 0;
        let nonHomeCost = 0;

        sessions.forEach(s => {
          const e = Number(s.energyAddedKwh) || 0;
          const c = Number(s.totalCost) || 0;
          if (s.chargerType === 'Home AC') {
            homeEnergy += e;
            homeCost += c;
          } else {
            nonHomeEnergy += e;
            nonHomeCost += c;
          }
        });

        const avgHomeRate = homeEnergy > 0 ? (homeCost / homeEnergy) : 12.0;
        const hypotheticalHomeCost = nonHomeEnergy * avgHomeRate;
        const savings = Math.max(0, nonHomeCost - hypotheticalHomeCost);

        return {
          avgHomeRate: Math.round(avgHomeRate * 100) / 100,
          nonHomeEnergy: Math.round(nonHomeEnergy * 10) / 10,
          nonHomeCost: Math.round(nonHomeCost * 100) / 100,
          hypotheticalHomeCost: Math.round(hypotheticalHomeCost * 100) / 100,
          savings: Math.round(savings * 100) / 100
        };
      }, [sessions]);

      // 6. Projected Cost for Next Month Based on Trend
      const nextMonthProjection = useMemo(() => {
        if (!sessions || sessions.length === 0) return null;
        const monthMap = {};
        sessions.forEach(s => {
          if (!s.date) return;
          const key = s.date.slice(0, 7);
          if (!monthMap[key]) {
            const [year, month] = key.split('-');
            const d = new Date(Number(year), Number(month) - 1, 1);
            monthMap[key] = {
              key,
              year: Number(year),
              month: Number(month),
              label: d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }),
              energy: 0,
              cost: 0
            };
          }
          monthMap[key].energy += (Number(s.energyAddedKwh) || 0);
          monthMap[key].cost += (Number(s.totalCost) || 0);
        });
        const sorted = Object.values(monthMap).sort((a, b) => a.key.localeCompare(b.key));
        if (sorted.length === 0) return null;

        const last = sorted[sorted.length - 1];
        let nextY = last.year;
        let nextM = last.month + 1;
        if (nextM > 12) {
          nextM = 1;
          nextY += 1;
        }
        const nextDate = new Date(nextY, nextM - 1, 1);
        const nextMonthLabel = nextDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        const totalEnergy = sessions.reduce((acc, s) => acc + (Number(s.energyAddedKwh) || 0), 0);
        const totalCost = sessions.reduce((acc, s) => acc + (Number(s.totalCost) || 0), 0);
        const weightedAvgRate = totalEnergy > 0 ? (totalCost / totalEnergy) : 15;

        let projectedKwh = last.energy;
        if (sorted.length >= 3) {
          const last3 = sorted.slice(-3);
          const avgKwh = last3.reduce((acc, m) => acc + m.energy, 0) / 3;
          const trendRate = (last3[2].energy - last3[0].energy) / (last3[0].energy || 1) / 2;
          const clampedTrend = Math.max(-0.08, Math.min(0.08, trendRate));
          projectedKwh = avgKwh * (1 + clampedTrend);
        }

        const projectedCost = projectedKwh * weightedAvgRate;

        return {
          nextMonthLabel,
          projectedKwh: Math.round(projectedKwh * 10) / 10,
          projectedCost: Math.round(projectedCost * 100) / 100,
          weightedAvgRate: Math.round(weightedAvgRate * 100) / 100
        };
      }, [sessions]);

      return (
        <div className="space-y-8 animate-in fade-in duration-200">
          {/* Header Banner */}
          <div className="p-6 rounded-3xl bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white shadow-xl relative overflow-hidden border border-slate-700/50">
            <div className="absolute -right-10 -bottom-10 w-60 h-60 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div className="relative z-10 max-w-3xl space-y-2">
              <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-brand-500/20 text-brand-400 border border-brand-500/30">
                <Icons.Zap className="w-3.5 h-3.5 text-brand-400" />
                Automated Energy Intelligence
              </span>
              <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight">
                Executive EV Energy & Cost Insights
              </h2>
              <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                We analyzed all {sessions.length} recorded charging events across locations, tariffs, time-of-use schedules, and consumption trends. Here is your operational summary explained in plain language.
              </p>
            </div>
          </div>

          {/* 6 Structured Insight Cards */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            {/* 1. Most Expensive Charging Location */}
            <div className="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between space-y-4">
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <span className="p-2.5 rounded-2xl bg-amber-50 dark:bg-amber-950/60 text-amber-500 border border-amber-200 dark:border-amber-800/60">
                    <Icons.Dollar className="w-5 h-5" />
                  </span>
                  <span className="text-[11px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300">
                    Highest Unit Cost
                  </span>
                </div>
                <div>
                  <h3 className="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                    Most Expensive Location
                  </h3>
                  <div className="text-xl font-extrabold text-slate-900 dark:text-white mt-1 truncate" title={mostExpensiveLocation?.name}>
                    {mostExpensiveLocation ? mostExpensiveLocation.name : '—'}
                  </div>
                </div>
                <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                  {mostExpensiveLocation ? (
                    <>
                      At <strong className="text-amber-600 dark:text-amber-400 font-bold">{formatRupee(mostExpensiveLocation.avgRate)}/kWh</strong>, this station represents your highest unit price. Across <strong>{mostExpensiveLocation.count} sessions</strong>, you spent a cumulative <strong>{formatRupee(mostExpensiveLocation.cost)}</strong> to take on {mostExpensiveLocation.energy.toFixed(1)} kWh.
                    </>
                  ) : 'No location data available.'}
                </p>
              </div>
              <div className="pt-3 border-t border-slate-100 dark:border-slate-800/80 text-[11px] text-slate-400">
                Tip: Reserve this location for necessary road-trip top-ups only.
              </div>
            </div>

            {/* 2. Cheapest vs. Most Expensive Charger Type */}
            <div className="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between space-y-4">
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <span className="p-2.5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-500 border border-emerald-200 dark:border-emerald-800/60">
                    <Icons.TrendingUp className="w-5 h-5" />
                  </span>
                  <span className="text-[11px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300">
                    {chargerRateComparison?.multiplier}× Rate Spread
                  </span>
                </div>
                <div>
                  <h3 className="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                    Charger Type Cost Spread
                  </h3>
                  <div className="text-xl font-extrabold text-slate-900 dark:text-white mt-1">
                    {chargerRateComparison ? `${formatRupee(chargerRateComparison.cheapest.avgRate)} vs. ${formatRupee(chargerRateComparison.mostExpensive.avgRate)}` : '—'}
                  </div>
                </div>
                <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                  {chargerRateComparison ? (
                    <>
                      <strong className="text-emerald-600 dark:text-emerald-400">{chargerRateComparison.cheapest.name}</strong> is your cheapest option at <strong>{formatRupee(chargerRateComparison.cheapest.avgRate)}/kWh</strong>, whereas <strong className="text-amber-600 dark:text-amber-400">{chargerRateComparison.mostExpensive.name}</strong> costs <strong>{formatRupee(chargerRateComparison.mostExpensive.avgRate)}/kWh</strong>. That makes DC Fast charging <strong className="text-slate-900 dark:text-white">{chargerRateComparison.multiplier}× more expensive</strong> per kWh.
                    </>
                  ) : 'No charger comparison available.'}
                </p>
              </div>
              <div className="pt-3 border-t border-slate-100 dark:border-slate-800/80 text-[11px] text-slate-400">
                Benchmark: Domestic off-peak power saves over 65% vs highway DCFC.
              </div>
            </div>

            {/* 3. Peak Charging Hours */}
            <div className="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between space-y-4">
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <span className="p-2.5 rounded-2xl bg-purple-50 dark:bg-purple-950/60 text-purple-500 border border-purple-200 dark:border-purple-800/60">
                    <Icons.Clock className="w-5 h-5" />
                  </span>
                  <span className="text-[11px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-purple-100 dark:bg-purple-950 text-purple-700 dark:text-purple-300">
                    {peakHours?.percentage}% of Sessions
                  </span>
                </div>
                <div>
                  <h3 className="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                    Peak Charging Hours
                  </h3>
                  <div className="text-xl font-extrabold text-slate-900 dark:text-white mt-1">
                    {peakHours ? peakHours.windowStr : '—'}
                  </div>
                </div>
                <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                  {peakHours ? (
                    <>
                      Your highest frequency charging window occurs between <strong className="text-purple-600 dark:text-purple-400">{peakHours.windowStr}</strong>, representing <strong className="text-slate-900 dark:text-white">{peakHours.count} sessions</strong> ({peakHours.percentage}% of all logs). This reflects disciplined overnight charging scheduled during lowest grid demand tariffs.
                    </>
                  ) : 'No charging hour data available.'}
                </p>
              </div>
              <div className="pt-3 border-t border-slate-100 dark:border-slate-800/80 text-[11px] text-slate-400">
                Smart Charging: Consistent late-night plug-in optimizes battery health.
              </div>
            </div>

            {/* 4. Month-over-Month (MoM) Change in Energy Use */}
            <div className="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between space-y-4">
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <span className="p-2.5 rounded-2xl bg-cyan-50 dark:bg-cyan-950/60 text-cyan-500 border border-cyan-200 dark:border-cyan-800/60">
                    <Icons.Zap className="w-5 h-5" />
                  </span>
                  <span className={`text-[11px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full ${
                    momChange && momChange.pctChange >= 0
                      ? 'bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300'
                      : 'bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300'
                  }`}>
                    {momChange ? `${momChange.pctChange >= 0 ? '+' : ''}${momChange.pctChange}% MoM` : 'MoM'}
                  </span>
                </div>
                <div>
                  <h3 className="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                    Month-over-Month Energy Trend
                  </h3>
                  <div className="text-xl font-extrabold text-slate-900 dark:text-white mt-1">
                    {momChange ? `${momChange.diffKwh >= 0 ? '+' : ''}${momChange.diffKwh} kWh` : '—'}
                  </div>
                </div>
                <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                  {momChange ? (
                    <>
                      In <strong>{momChange.curr.label}</strong>, you drew <strong>{momChange.curr.energy.toFixed(1)} kWh</strong>, compared to <strong>{momChange.prev.energy.toFixed(1)} kWh</strong> in {momChange.prev.label}. This marks a <strong className={momChange.pctChange >= 0 ? 'text-amber-600 dark:text-amber-400' : 'text-emerald-600 dark:text-emerald-400'}>{Math.abs(momChange.pctChange)}% {momChange.pctChange >= 0 ? 'rise' : 'drop'}</strong> in energy consumption between the two most recent cycles.
                    </>
                  ) : 'Need at least 2 recorded months for MoM comparison.'}
                </p>
              </div>
              <div className="pt-3 border-t border-slate-100 dark:border-slate-800/80 text-[11px] text-slate-400">
                Context: Weather shifts and seasonal road trips drive natural month-to-month swings.
              </div>
            </div>

            {/* 5. Estimated Savings if All Charging was Done at Home */}
            <div className="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between space-y-4">
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <span className="p-2.5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-500 border border-emerald-200 dark:border-emerald-800/60">
                    <Icons.PlusCircle className="w-5 h-5" />
                  </span>
                  <span className="text-[11px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300">
                    100% Home Scenario
                  </span>
                </div>
                <div>
                  <h3 className="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                    Potential Home Charging Savings
                  </h3>
                  <div className="text-xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1">
                    {allHomeSavings ? `${formatRupee(allHomeSavings.savings)} Potential` : '—'}
                  </div>
                </div>
                <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                  {allHomeSavings ? (
                    <>
                      You drew <strong>{allHomeSavings.nonHomeEnergy} kWh</strong> at public and DC fast chargers costing <strong>{formatRupee(allHomeSavings.nonHomeCost)}</strong>. Had all that power been charged at home (averaging <strong>{formatRupee(allHomeSavings.avgHomeRate)}/kWh</strong>), it would have cost only <strong>{formatRupee(allHomeSavings.hypotheticalHomeCost)}</strong> — yielding <strong>{formatRupee(allHomeSavings.savings)} in extra savings</strong>.
                    </>
                  ) : 'No commercial charging data to compare.'}
                </p>
              </div>
              <div className="pt-3 border-t border-slate-100 dark:border-slate-800/80 text-[11px] text-slate-400">
                Strategy: Pre-charging to 90% before weekend excursions maximizes domestic rate savings.
              </div>
            </div>

            {/* 6. Projected Cost for Next Month Based on Trend */}
            <div className="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between space-y-4">
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <span className="p-2.5 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-500 border border-indigo-200 dark:border-indigo-800/60">
                    <Icons.Calendar className="w-5 h-5" />
                  </span>
                  <span className="text-[11px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300">
                    Forward Forecast
                  </span>
                </div>
                <div>
                  <h3 className="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                    Projected Cost for {nextMonthProjection?.nextMonthLabel || 'Next Month'}
                  </h3>
                  <div className="text-xl font-extrabold text-indigo-600 dark:text-indigo-400 mt-1">
                    {nextMonthProjection ? formatRupee(nextMonthProjection.projectedCost) : '—'}
                  </div>
                </div>
                <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                  {nextMonthProjection ? (
                    <>
                      Projected on your recent 3-month rolling usage trajectory and current blended unit cost of <strong>{formatRupee(nextMonthProjection.weightedAvgRate)}/kWh</strong>, your anticipated energy draw for <strong>{nextMonthProjection.nextMonthLabel}</strong> is approximately <strong>~{nextMonthProjection.projectedKwh} kWh</strong>, forecast at <strong>{formatRupee(nextMonthProjection.projectedCost)}</strong>.
                    </>
                  ) : 'Calculating forward trend...'}
                </p>
              </div>
              <div className="pt-3 border-t border-slate-100 dark:border-slate-800/80 text-[11px] text-slate-400">
                Predictive Model: Incorporates rolling multi-month baseline and utility distribution.
              </div>
            </div>

          </div>

          {/* Actionable Recommendations Checklist */}
          <div className="p-6 sm:p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
            <div className="flex items-center justify-between">
              <h3 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-brand-500"></span>
                Actionable Efficiency Takeaways
              </h3>
              <span className="text-xs text-slate-400">Fleet Optimization</span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
              <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 space-y-1.5">
                <div className="font-bold text-slate-900 dark:text-white">1. Schedule Preconditioning</div>
                <p className="text-slate-600 dark:text-slate-400 leading-relaxed">
                  Warm or cool the battery while still plugged into your home charger at night to preserve battery range during initial driving kilometers.
                </p>
              </div>
              <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 space-y-1.5">
                <div className="font-bold text-slate-900 dark:text-white">2. Avoid Fast Charging Over 80%</div>
                <p className="text-slate-600 dark:text-slate-400 leading-relaxed">
                  DC fast charging power significantly tapers above 80% SoC. Unplugging around 75-80% avoids expensive idle or reduced charge rate fees.
                </p>
              </div>
              <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 space-y-1.5">
                <div className="font-bold text-slate-900 dark:text-white">3. Off-Peak Night Timers</div>
                <p className="text-slate-600 dark:text-slate-400 leading-relaxed">
                  Locking vehicle charging start times between 10 PM and 5 AM guarantees you capture lowest tier electricity rates year-round.
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
<div id="vt-toast" class="vt-hidden"></div>
</body>
</html>
